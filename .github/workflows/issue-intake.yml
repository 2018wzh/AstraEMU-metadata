name: issue-intake

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: issue-intake-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  intake:
    if: github.event.label.name == 'compat:accepted'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_BODY: ${{ github.event.issue.body }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install jsonschema
      - name: Convert issue form
        id: entry
        shell: bash
        run: |
          LABELED_AT="$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/events" --paginate \
            --jq '.[] | select(.event == "labeled" and .label.name == "compat:accepted") | .created_at' | tail -n 1)"
          printf '%s' "$ISSUE_BODY" > "$RUNNER_TEMP/issue-body.md"
          set +e
          python tools/issue_to_entry.py \
            --body-file "$RUNNER_TEMP/issue-body.md" \
            --issue "$ISSUE_NUMBER" \
            --labeled-at "$LABELED_AT" \
            --github-output "$GITHUB_OUTPUT" > "$RUNNER_TEMP/intake.log"
          status=$?
          set -e
          cat "$RUNNER_TEMP/intake.log"
          if [ "$status" -eq 0 ]; then
            python tools/validate.py > "$RUNNER_TEMP/validate.log" 2>&1 || status=$?
            cat "$RUNNER_TEMP/validate.log"
            if [ "$status" -ne 0 ]; then
              cp "$RUNNER_TEMP/validate.log" "$RUNNER_TEMP/intake.log"
            fi
          fi
          if [ "$status" -ne 0 ]; then
            {
              echo '兼容性报告未能转换为条目，请按以下原因修改 issue 后由维护者重新添加 `compat:accepted` 标签：'
              echo
              sed 's/^/- /' "$RUNNER_TEMP/intake.log"
            } > "$RUNNER_TEMP/comment.md"
            gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/comment.md"
            gh issue edit "$ISSUE_NUMBER" --remove-label 'compat:accepted'
            echo 'accepted=false' >> "$GITHUB_OUTPUT"
          else
            echo 'accepted=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Open pull request
        if: steps.entry.outputs.accepted == 'true'
        shell: bash
        env:
          ENTRY_PATH: ${{ steps.entry.outputs.path }}
          ENTRY_VID: ${{ steps.entry.outputs.vid }}
          ENTRY_RID: ${{ steps.entry.outputs.rid }}
          ENTRY_EMULATOR: ${{ steps.entry.outputs.emulator }}
        run: |
          branch="compat/issue-$ISSUE_NUMBER"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$branch"
          git add -- "$ENTRY_PATH"
          git commit -m "compat: $ENTRY_VID/$ENTRY_RID $ENTRY_EMULATOR (#$ISSUE_NUMBER)"
          git push --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "compat: $ENTRY_VID/$ENTRY_RID $ENTRY_EMULATOR (#$ISSUE_NUMBER)" \
              --body "Closes #$ISSUE_NUMBER"
          fi
